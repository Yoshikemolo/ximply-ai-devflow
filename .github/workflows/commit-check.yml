name: Commit check

# The commit-msg hook checks a message on the author's machine, but a hook
# is opt-in per clone. This gate checks every message that reaches GitHub.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the commit messages
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE..$HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            range="$AFTER^!"
          else
            range="$BEFORE..$AFTER"
          fi
          python tools/check_commit_msg.py --range "$range"
